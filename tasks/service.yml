---
# NOTE: also tagged tutor_config so a unit-file fix self-delivers through the
# first CI playbook (`-t tutor_config`) — the only one a host whose reload is
# currently failing ever reaches (the job aborts before `-t tutor_service`).
- name: TUTOR | Copy Daemon script
  ansible.builtin.template:
    src: tutor.service.j2
    dest: /etc/systemd/system/tutor.service
    mode: "0644"
    owner: root
    group: root
  notify:
    - Reload systemd daemon
    - Reload tutor
  tags:
    - tutor_service
    - tutor_config

- name: TUTOR | Configuring service
  ansible.builtin.systemd:
    name: tutor
    state: "{{ tutor_service_state }}"
    enabled: "{{ tutor_service_enabled }}"
    daemon_reload: true
  tags:
    - tutor_service
